[workspace]
resolver = "2"
members = [
    "crates/adb-core",
    "crates/adb-storage",
    "crates/adb-planner",
    "crates/adb-exec",
    "crates/adb-engine",
    "crates/adb-query",
    "crates/adb-mcp",
    "crates/adb-api",
    "crates/adb-server",
    "bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.90"  # std::fs::File::try_lock needs 1.89, roaring 0.11 needs 1.90
repository = "https://github.com/sivsivsree/agedb"
homepage = "https://github.com/sivsivsree/agedb"
readme = "README.md"
keywords = ["database", "analytics", "mcp", "agents", "columnar"]
categories = ["database-implementations"]

[workspace.dependencies]
adb-core = { path = "crates/adb-core" }
adb-storage = { path = "crates/adb-storage" }
adb-planner = { path = "crates/adb-planner" }
adb-exec = { path = "crates/adb-exec" }
adb-engine = { path = "crates/adb-engine" }
adb-query = { path = "crates/adb-query" }
adb-mcp = { path = "crates/adb-mcp" }
adb-api = { path = "crates/adb-api" }

arrow = "59.3"
parquet = { version = "59.3", features = ["arrow"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "fs", "io-std", "io-util", "sync", "time", "signal"] }
axum = "0.8"
futures-util = { version = "0.3", default-features = false }
async-trait = "0.1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
bincode = "1.3"
thiserror = "2"
crc32fast = "1.5"
roaring = "0.11"
ahash = "0.8"
arc-swap = "1.9"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
bytes = "1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

# Debug info for a workspace this size (arrow and parquet included) is several
# GB of build artifacts and buys little here, so it is off by default. Turn it
# back on locally with `RUSTFLAGS="-C debuginfo=1"` when you need a symbolized
# backtrace.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
# `codegen-units = 1` costs many minutes of build time here (arrow and parquet
# are large) for a few percent on hot loops that live inside arrow anyway, so
# the default parallel codegen stays.
lto = "thin"
debug = false
